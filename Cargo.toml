[workspace]
resolver = "3"
members = ["crates/tune-engine", "crates/memprove-tune"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sha2 = { version = "=0.11.0", default-features = false }
tempfile = { version = "=3.27.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
