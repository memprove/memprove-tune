# Format, lint and test the workspace on macOS and Ubuntu. No real agent
# is run here: every test uses an agent that is a shell script.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the same version; a newer Rust brings new
      # clippy lints that fail -D warnings, so moving to one is its own
      # change, made here and there together.
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Show the toolchain
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.96.0-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # scripts/install.sh, offline: fake releases and a fake curl. shellcheck is
  # on the runner and the test runs it first. The installer is tried under
  # dash (Ubuntu's sh) and under bash (macOS's sh is a bash).
  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the installer under sh
        run: bash scripts/test-install.sh

      - name: Test the installer under bash
        run: INSTALLER_SH=bash bash scripts/test-install.sh
